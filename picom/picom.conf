backend = "glx";
vsync = true;

animations = (
  {
    triggers = ["open", "show"];
    preset = "appear";
    scale = 0.9;
    duration = 0.2;
  },
  {
    triggers = ["close", "hide"];
    preset = "disappear";
    scale = 0.9;
    duration = 0.2;
  },
  {
    triggers = ["geometry"];
    preset = "geometry-change";
    duration = 0.2;
  }
);
