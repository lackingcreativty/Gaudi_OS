[colors]
base = #1e1e2e
text = #cdd6f4
mauve = #cba6f7
overlay = #6c7086

[bar/main]
width = 100%
height = 28
background = ${colors.base}
foreground = ${colors.text}
font-0 = JetBrainsMono Nerd Font:size=10;2
padding-left = 1
padding-right = 1
module-margin = 1
tray-position = right
tray-padding = 4
enable-ipc = true
modules-left = i3 profile
modules-center = date
modules-right = pulseaudio power powerbtn

[module/i3]
type = internal/i3
pin-workspaces = true
label-focused = %index%
label-focused-foreground = ${colors.mauve}
label-focused-padding = 1
label-unfocused = %index%
label-unfocused-foreground = ${colors.overlay}
label-unfocused-padding = 1

[module/date]
type = internal/date
interval = 1
date = %a %d %b
time = %H:%M
label = %date%  %time%

[module/pulseaudio]
type = internal/pulseaudio
label-volume = VOL %percentage%%
label-muted = MUTED

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
label-charging = CHG %percentage%%
label-discharging = BAT %percentage%%

[module/profile]
type = custom/script
exec = ~/.config/polybar/profile.sh
interval = 2

[module/power]
type = custom/script
exec = ~/.config/polybar/battery.sh
interval = 10

[module/powerbtn]
type = custom/text
content = OFF
content-foreground = ${colors.mauve}
click-left = ~/.config/rofi/powermenu.sh
